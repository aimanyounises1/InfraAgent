name: Verify local prototype
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: uv sync --frozen --extra dev --extra ollama
      - run: npm ci
        working-directory: dashboard
      - run: sh .claude/docs-first/verify.sh
      - name: Verify distributable imports outside the checkout
        run: |
          uv build --wheel
          uv venv wheel-check
          uv pip install --python wheel-check/bin/python dist/*.whl
          WHEEL_PYTHON="$PWD/wheel-check/bin/python"
          cd "$RUNNER_TEMP"
          "$WHEEL_PYTHON" -c 'import config, platform_detect, api.main; from mcp_servers.policy import blocked_mutation; assert blocked_mutation("smoke") is not None'
