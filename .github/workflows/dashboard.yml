name: Dashboard

on:
  push:
    branches: [main]
    paths: ['dashboard/**']
  pull_request:
    paths: ['dashboard/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: cd dashboard && npm ci

      - name: Build
        run: cd dashboard && npm run build
