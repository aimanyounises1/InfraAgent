version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - INFRA_AGENT_LLM_PROVIDER=ollama
      - INFRA_AGENT_OLLAMA_BASE_URL=http://host.docker.internal:11434
      - INFRA_AGENT_OLLAMA_MODEL=nemotron-3-nano
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ~/.kube:/root/.kube:ro  # K8s access if available
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

  # Optional: Run Ollama in Docker instead of using host's Ollama
  # ollama:
  #   image: ollama/ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama

# volumes:
#   ollama_data:
